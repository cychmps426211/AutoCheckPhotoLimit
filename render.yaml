services:
  - type: web
    name: autocheckphotolimit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: SEIWA_BASE_URL
        value: https://dl02.seiwainc.com.tw
      - key: DEFAULT_TECHNICIAN_UNO
        value: "91"
      - key: SEIWA_ACCOUNT
        sync: false
      - key: SEIWA_PASSWORD
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
